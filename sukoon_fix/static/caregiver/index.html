<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sukoon — Caregiver Dashboard</title>
<link rel="stylesheet" href="/app/css/base.css">
<link rel="stylesheet" href="/app/js/vendor/leaflet/leaflet.css">
<script src="/app/js/vendor/chart.umd.js"></script>
<script src="/app/js/vendor/leaflet/leaflet.js"></script>
<style>
  .cg-layout { display: flex; min-height: calc(100vh - 60px); }
  .cg-sidebar { width: 260px; background: #fff; border-right: 1px solid var(--sukoon-line); padding: 16px; flex-shrink: 0; }
  .cg-sidebar h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sukoon-ink-500); margin: 4px 0 10px; }
  .cg-patient-item {
    display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; cursor: pointer; margin-bottom: 6px; border: 1px solid transparent;
  }
  .cg-patient-item.active { background: var(--sukoon-teal-50); border-color: var(--sukoon-teal-100); }
  .cg-patient-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sukoon-teal-600); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .cg-patient-name { font-weight: 700; font-size: 0.92rem; }
  .cg-patient-sub { font-size: 0.76rem; color: var(--sukoon-ink-500); }
  .cg-main { flex: 1; min-width: 0; }
  .cg-content { padding: 24px; max-width: 1180px; }
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .stat-chip { background: var(--sukoon-teal-50); border: 1px solid var(--sukoon-teal-100); border-radius: 10px; padding: 8px 12px; font-size: 0.82rem; color: var(--sukoon-teal-900); }
  .chart-wrap { height: 240px; }
  .cg-form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 10px; }
  .sk-checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; padding: 4px 0; }
</style>
</head>
<body>
  <div class="sk-topbar">
    <div class="sk-brand"><span class="sk-logo">🧘</span> Sukoon <span class="sk-role-pill">Caregiver</span></div>
    <div class="sk-topbar-actions">
      <span id="cgUserName" style="font-size:0.88rem; color:var(--sukoon-ink-700);"></span>
      <button class="sk-btn sk-btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="cg-layout">
    <div class="cg-sidebar">
      <h3>My Patients</h3>
      <div id="patientList"><div class="sk-loading">…</div></div>
    </div>

    <div class="cg-main">
      <div class="sk-tabbar" id="tabbar">
        <div class="sk-tab active" data-tab="overview">Overview</div>
        <div class="sk-tab" data-tab="agents">🤖 AI Care Agents</div>
        <div class="sk-tab" data-tab="medicines">Medicines</div>
        <div class="sk-tab" data-tab="reminders">Reminders</div>
        <div class="sk-tab" data-tab="routines">Routine</div>
        <div class="sk-tab" data-tab="appointments">Appointments</div>
        <div class="sk-tab" data-tab="contacts">Family &amp; Contacts</div>
        <div class="sk-tab" data-tab="doctors">Authorized Doctors</div>
        <div class="sk-tab" data-tab="safety">Location &amp; Wearable</div>
        <div class="sk-tab" data-tab="alerts">Alerts</div>
      </div>
      <div class="cg-content" id="tabContent"><div class="sk-loading">Loading dashboard…</div></div>
    </div>
  </div>

<script src="/app/js/api.js"></script>
<script src="/app/js/i18n.js"></script>
<script src="/app/js/util.js"></script>
<script src="/app/js/voice.js"></script>
<script src="/app/js/agentic-ui.js"></script>
<script src="/app/js/caregiver.js"></script>
</body>
</html>
